[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "po-translator"
version = "1.1.0"
description = "Odoo PO localization workbench with Gemini translation and offline glossary assistance"
readme = "README.md"
authors = [{ name = "Yassine Naanani" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "polib>=1.2.0",
  "customtkinter>=5.2.0",
  "lingua-language-detector>=2.0.2",
  "google-genai>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
po-translator = "po_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
addopts = "-ra"
